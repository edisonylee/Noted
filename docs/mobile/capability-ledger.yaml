schema_version: "noted.mobile-capability-ledger.v1"
last_updated: "2026-08-17"
scope: "Supported standard-profile capabilities on iPhone; parked experiments and explicit exclusions are recorded rather than silently promoted."
source_of_truth: "docs/MOBILE_COMPANION_IMPLEMENTATION_PLAN.md"

current_checkpoint:
  milestone: "M4 sanitized-fixture implementation; gate remains closed"
  proven: "M2 signed physical-device shell and local persistence, plus M3 ordered migration and portable Notes contracts."
  implemented_now: "Portable Notes workspace/UI and local store; filing/undo, Trash/restore, external-authority fail-closed behavior, conflict preservation choices, public-ID note deep links, deterministic convergence application, and fixture-only pairing/direct-sync logical cores."
  not_proven: "Production cryptography and key custody, a real pinned TLS/HTTP adapter, durable Mac authority/device registry, external cryptographic review, combined Mac-to-physical-iPhone sync, or the outstanding physical Data Protection/Keychain/lifecycle/accessibility and recorder-load gates."
  next: "Close the remaining M2 and M4 production-security and physical-device gates before personal-data sync or hosted-provider evaluation."

hosted_provider_gate:
  evaluate_after: "M4 direct Notes convergence passes."
  provision_at: "M7, only when off-LAN continuity, clean-device recovery, or a tester cohort creates a concrete need."
  spend_now: false
  future_paid_provider_allowed: true

status_definitions:
  local_prototype: "Present only in the isolated native iPhone prototype; not portable or synchronized."
  implementation_checkpoint: "Implemented in the current branch and covered by deterministic tests; not necessarily shipped or physically validated."
  partial_implementation_checkpoint: "A named subset is implemented in the current branch; the implementation_note records what remains in that capability."
  fixture_protocol_core: "The logical protocol/state core is implemented for generated or sanitized fixtures; production crypto, transport, durable authority, and personal-data use remain gated."
  planned: "Accepted mobile contract with implementation gated by the named milestone."
  revived_scope_planned: "A component exists in the repository but is not a routed standard desktop surface; mobile inclusion is deliberate new/revived scope."
  excluded: "Intentionally absent from mobile v1 with a recorded reason."

navigation:
  primary_tabs:
    - "today"
    - "calendar"
    - "capture"
    - "notes"
    - "more"
  notes_owns:
    - "all_notes"
    - "inbox"
    - "needs_filing"
    - "meetings"
    - "spaces_and_folders"
    - "trash"
  more_owns:
    - "people"
    - "knowledge"
    - "recaps"
    - "trends"
  settings_entry: "sync_or_profile_control"
  global_search: "Deep-links each result to its owning destination; it does not create a duplicate content hierarchy."

required_record_states:
  - "local_only"
  - "pending_sync"
  - "synced"
  - "waiting_for_mac"
  - "processing_on_mac"
  - "ready"
  - "stale_but_usable"
  - "conflict_preserved"
  - "content_unavailable_on_device"
  - "retryable_error"
  - "device_revoked_or_session_expired"

