[package]
name = "Noted"
version = "0.1.0"
description = "A local-first personal context system"
authors = ["Noted contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Opt-in development surface for the iOS simulator only. The native plugin
# separately requires DEBUG + simulator + its exact runtime gate, while the
# physical-device branch always requests a Secure Enclave identity.
sanitized-development-fixtures = [
  "dep:hpke",
  "dep:p256",
  "dep:rand_core",
  "noted-apple-security/sanitized-development-fixtures",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
hound = "3"
# Independent, test-only implementations and RNG traits for the Decision 008
# Rust <-> CryptoKit interoperability vectors. These dependencies are not
# linked into production application targets.
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = "0.9"

[dependencies]
# The iOS app keeps this common dependency set minimal. Desktop-only services
# and native libraries live in the target table below so they cannot leak into
# an iPhone binary. rusqlite provides the isolated on-device notes store.
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
zeroize = "1"
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"], optional = true }
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
rand_core = { version = "0.9", features = ["os_rng"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-cert = { version = "0.2", default-features = false }
# Shared public record format and native iPhone custody boundary. The desktop
# build uses only its feature-gated sanitized fixture provider; private iPhone
# key operations remain implemented by the iOS plugin.
noted-apple-security = { path = "crates/noted-apple-security" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
hyper = { version = "1", default-features = false, features = ["server"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
printpdf = "0.7"

# Desktop vector search (pinned compatible combo — see sqlite-vec rust docs)
sqlite-vec = "=0.1.9"
zerocopy = "0.7"

# Talk to local Ollama (text + vision + embeddings)
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
base64 = "0.22"

# Shared async runtime / error helpers ("rt" for JoinSet — the multi-calendar
# event fetch fans out one task per calendar on tauri's runtime)
tokio = { version = "1", features = ["sync", "rt"] }
anyhow = "1"
regex = "1"
# PKCE S256 challenge + deterministic Google Calendar event ids use the shared
# SHA-256 dependency above; mobile portable-record hashing uses the same crate.

# Phone capture + full web client: tiny LAN server, now over TLS so mobile
# browsers grant mic/camera access (a secure context is required for getUserMedia).
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
local-ip-address = "0.6"
libc = "0.2"
# Self-signed cert for the LAN HTTPS server (pure-Rust, no OpenSSL system dep).
rcgen = "0.13"
# SO_REUSEADDR on the LAN listener so the fixed phone port (8787) rebinds
# immediately across `tauri dev` restarts instead of drifting to 8788.
socket2 = "0.6"

# Local speech-to-text (whisper.cpp, in-process)
whisper-rs = "0.16"

# Speaker embeddings for meeting diarization (sherpa-onnx, statically linked;
# the ~27MB English ERes2Net model downloads from Settings like whisper).
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static"] }

# Meeting recorder: native mic capture (kept separate from system audio so
# speaker attribution is a deterministic mic="me" / system="them").
cpal = "0.17"
# WAV retention for meeting audio (transcript verifiability — audio stays local).
hound = "3"

# System audio via Core Audio process taps (macOS 14.4+, gated at runtime).
[target.'cfg(target_os = "macos")'.dependencies]
cidre = "0.16"
mdns-sd = "0.20.3"
# Apple Calendar (EventKit) reads. In-process on purpose: TCC attributes the
# calendar prompt to the binary that asks, so this keeps it as noted itself
# rather than a spawned helper. Full access is macOS 14+, gated at runtime.
objc2 = "0.6"
objc2-user-notifications = "0.3"
# The EventKit access prompt is delivered through an Objective-C block.
block2 = "0.6"
objc2-core-graphics = "0.3"
objc2-foundation = { version = "0.3", features = [
  "NSArray", "NSDate", "NSString", "NSPredicate", "NSError", "NSURL", "NSValue",
] }
# objc2-core-graphics (not app-kit) buys the real calendar colours via CGColor
# without dragging AppKit in for one accessor.
objc2-event-kit = { version = "0.3", features = [
  "EKObject", "EKEventStore", "EKCalendar", "EKCalendarItem", "EKEvent",
  "EKSource", "EKParticipant", "EKTypes", "block2", "objc2-core-graphics",
] }
# Native window vibrancy: the sidebar's dark-glass look (desktop shows through).
window-vibrancy = "0.6"

[target.'cfg(target_os = "ios")'.dependencies]
# Native custom-scheme delivery for public-ID note links. The parser and local
# library check remain in the Rust command boundary before navigation occurs.
tauri-plugin-deep-link = "2"
