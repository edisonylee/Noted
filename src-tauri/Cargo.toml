[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
hound = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local DB + vector search (pinned compatible combo — see sqlite-vec rust docs)
rusqlite = { version = "0.32.1", features = ["bundled"] }
sqlite-vec = "=0.1.9"
zerocopy = "0.7"

# Talk to local Ollama (text + vision + embeddings)
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"

# Shared async runtime / error helpers ("rt" for JoinSet — the multi-calendar
# event fetch fans out one task per calendar on tauri's runtime)
tokio = { version = "1", features = ["sync", "rt"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
# PKCE S256 challenge + deterministic Google Calendar event ids.
sha2 = "0.10"

# Phone capture + full web client: tiny LAN server, now over TLS so mobile
# browsers grant mic/camera access (a secure context is required for getUserMedia).
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
local-ip-address = "0.6"
rand = "0.8"
# Self-signed cert for the LAN HTTPS server (pure-Rust, no OpenSSL system dep).
rcgen = "0.13"
# SO_REUSEADDR on the LAN listener so the fixed phone port (8787) rebinds
# immediately across `tauri dev` restarts instead of drifting to 8788.
socket2 = "0.6"

# Local speech-to-text (whisper.cpp, in-process)
whisper-rs = "0.16"

